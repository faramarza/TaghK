# Collector — PLANE 3 front end. Measurement only.
#
# DEPLOYED SEPARATELY FROM THE DISTRIBUTOR ON PURPOSE.
# Different Worker, different KV, different admin key. Compromising the
# measurement plane must not yield the credential-issuance plane. Co-locating
# these for convenience merges both blast radii.

name = "collect"
main = "collector-worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "PROBES"            # wrangler kv namespace create PROBES
id = "REPLACE_PROBES_ID"

[[kv_namespaces]]
binding = "MEASUREMENTS"      # wrangler kv namespace create MEASUREMENTS
id = "REPLACE_MEASUREMENTS_ID"

# Secrets — set with `wrangler secret put <NAME> -c wrangler.collector.toml`
#   PROBE_HMAC_KEY   openssl rand -hex 32
#   MANIFEST_SK      npm run keygen:manifest   (Ed25519 PKCS#8, base64)
#   COLLECTOR_ADMIN  openssl rand -hex 32      MUST DIFFER from ADMIN_KEY
#   ENROL_SALT       openssl rand -hex 32      never rotate

# ── Strongly consistent storage (04-STATUS.md defects 2.1 / 2.2) ───────────
# Spend records and rate limiters CANNOT live in KV: a read-then-write against
# eventually consistent storage is not exactly-once, and both were.
# See docs/adr/0001-durable-objects-for-exactly-once.md.

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger", "RateLimiter"]

[observability]
enabled = false               # no logs, architecturally — not as policy
