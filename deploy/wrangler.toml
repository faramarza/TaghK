# Distributor — PLANE 1. Credential issuance only.
#
# Deploying on Workers is deliberate: *.workers.dev rides CDN infrastructure a
# censor generally cannot afford to block, which puts the distribution channel
# in a DIFFERENT FAILURE DOMAIN than the transport it describes. If the
# subscription URL dies with the proxies, you are hand-delivering configs to
# millions of people.

name = "dist"
main = "distributor-worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "ACCOUNTS"          # wrangler kv namespace create ACCOUNTS
id = "REPLACE_ACCOUNTS_ID"

[[kv_namespaces]]
binding = "NODES"             # wrangler kv namespace create NODES
id = "REPLACE_NODES_ID"

# Secrets — set with `wrangler secret put <NAME>`
#   ADMIN_KEY   openssl rand -hex 32   rotate quarterly
#   KEY_SALT    openssl rand -hex 32   NEVER ROTATE (invalidates all digests)
#                                      MUST DIFFER from ADMIN_KEY
#   VOPRF_MASTER  npm run keygen:voprf
#               Per-epoch keys are DERIVED from this; there is no rotation
#               ceremony and nothing else to set. See voprf.js 'Key epochs'.

# ── Strongly consistent storage (04-STATUS.md defects 2.1 / 2.2) ───────────
# Spend records and rate limiters CANNOT live in KV: a read-then-write against
# eventually consistent storage is not exactly-once, and both were.
# See docs/adr/0001-durable-objects-for-exactly-once.md.

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Reverse index and suspicion counters (04-STATUS.md 2.8). The lineage blob
# itself stays in KV — it is read on every subscription poll.
[[durable_objects.bindings]]
name = "ATTRIBUTION"
class_name = "Attribution"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger", "RateLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Attribution"]

[observability]
enabled = false               # no logs, architecturally — not as policy
